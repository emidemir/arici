server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s;  # Docker's embedded DNS — without this,
                                     # nginx can cache a stale backend IP
                                     # if the container ever restarts

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(api|users|farms|chats|notifications)/. {
        set $backend http://arici_backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $backend http://arici_backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}