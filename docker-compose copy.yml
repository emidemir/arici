services:
  # postgis
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - PGDATA=/var/lib/pgsql/data
    volumes:
      - db:/var/lib/pgsql/data
    networks:
      - arici
      
  # backend
  backend:
    build: 
      context: ./backend
      # If your dockerfile is named differently, uncomment and change the line below:
      # dockerfile: Dockerfile 
    depends_on:
      - postgis
    networks:
      - arici

  # frontend
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    networks:
      - arici

networks:
  arici:
    driver: bridge

volumes:
  db:
  esdata01:
  minio_data: